name: Deploy dashboard

on:
  push:
    branches: [main]
  # The data workflows call this after pushing a commit, but github.sha in a called
  # workflow is still the caller's trigger SHA, from before that push. They pass the
  # pushed SHA as `ref` so the build contains the data they just committed.
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the triggering SHA
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
